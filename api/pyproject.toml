[project]
name = "ailearn-api"
version = "0.1.0"
description = "Learning API for ailearn (Cloud Run)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.38",
    "pydantic-settings>=2.11",
    "firebase-admin>=7.7.0",
    "google-genai>=3.0",
    "google-cloud-texttospeech>=2.38",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# tests/ is offline (make check-api). tests_integration/ needs the Firestore emulator and runs
# only with `make check-api-integration`.
testpaths = ["tests"]
markers = ["integration: needs the Firestore emulator (make check-api-integration)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
