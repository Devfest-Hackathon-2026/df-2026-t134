# `make speak` が書き出すファイル（手で編集しない）。固定セリフ（話す人ごと）と、その音声の保存先。
# `make seed` がこの対応表から教材の intro.audioPath と紙しばいの場面の audioPath を埋める。
lines:
- speaker: mascot
  text: 'こんにちは！今日は、AI がどうやって文章をつくっているのか、のぞいてみよう。

    じつは AI は「次に来ることば」を予想するのがとても得意なんだ。'
  audioPath: audio/lines/eaee6241fbff7b6bf713aea68e1b5ef141dca6cd9795ab1f8bff791dfd449e71.mp3
- speaker: mascot
  text: 'AI はとても便利だけど、なんでもできるわけじゃないんだ。

    得意なことと苦手なことを知って、上手につきあおう！'
  audioPath: audio/lines/226f57a26c83d9feb2720efd5dbf29531889e535b06e541d3d0eca40fe4cd957.mp3
- speaker: mascot
  text: 'AI は、勉強や調べものの心強い助っ人になるよ。

    でも、答えを丸写しするのはもったいない！上手な使い方を練習しよう。'
  audioPath: audio/lines/bf9d8199d17cad006cf98f2ab8df2fc595a0b8de8701430e34b430e29d5ccc2f.mp3
- speaker: mascot
  text: '今日は、中学2年生のユイのお話を、紙しばいで見ていこう。

    お話のとちゅうで「ユイはどうする？」と聞くから、いちばんいいと思うものをえらんでね！'
  audioPath: audio/lines/f728d94e021beb523c533d9e853c0cca6c078eed0f1e3f27019562f8e2f4ce73.mp3
- speaker: narrator
  text: 夏休み。ユイは、自由研究で「ホタルが光るしくみ」を調べることにしました。
  audioPath: audio/lines/fa2ea86c8164bec6bf305f1b688a36a55627d1d2eb44edb4aa375a4e100a73f6.mp3
- speaker: student
  text: ねえ AI、ホタルはどうして光るの？
  audioPath: audio/lines/f442e284e7529612923a3c277d083b681e632644591f73a7c6695dc1ab66663e.mp3
- speaker: ai
  text: ホタルは、おしりの中で電気をつくって、豆電球のように光っています！
  audioPath: audio/lines/6c3c332bf96bcd5f1fc7dcebe3ed24d167f3417d9c84a3ad1137cf7b6b856265.mp3
- speaker: student
  text: わあ、すごく分かりやすい！　このままレポートに書いちゃおうかな。
  audioPath: audio/lines/40ad0584b44d12213af15bba48188106d28ac8cc1e73dd99f8ebf11af6e7e0ef.mp3
- speaker: narrator
  text: 放課後の教室。ソウタが、タブレットを見ながら楽しそうにしています。
  audioPath: audio/lines/6de02fb7486bfffbd55719519aeef8743f6cdbf8b680371aede5326734c7bfa1.mp3
- speaker: friend
  text: 見て！　クラスのみんなの写真を AI に入れて、おもしろい合成画像をつくろうと思うんだ。
  audioPath: audio/lines/d787f12a2bc5ccb0d311e201d265e9627104916a212289ed4a41c9df2e8da780.mp3
- speaker: friend
  text: 名前と住所も入れたら、もっとリアルなプロフィールができるかも！
  audioPath: audio/lines/647e74bdf9520a8ae0d36c78aea1228cc142a93791c1486c6702699a33859ae4.mp3
- speaker: student
  text: え……それって、大丈夫なのかな。
  audioPath: audio/lines/2dcdc837b9112a6fa3eec99b29874066207158f6b90325fc1064acf644bda3dc.mp3
- speaker: narrator
  text: 国語の宿題は「わたしの好きな季節」という作文。ユイは、何を書くか決められずにいます。
  audioPath: audio/lines/606c1d77fa289e927b6eb9618fae917bfe39e39a380cba20249088205c43908e.mp3
- speaker: student
  text: そうだ、AI にアイデアを出してもらおうかな。
  audioPath: audio/lines/b01e461b905b2b9e93db222e624aac20c716236fd4183ce11663c1ef772ea7e8.mp3
- speaker: ai
  text: たとえば「夏祭りの思い出」「冬の朝の空気」「春の通学路」はどうでしょう？　作文をまるごと書くこともできますよ。
  audioPath: audio/lines/95c59ba2ba73efa9c210edb9dd519dab0e722c11e760c2a63ec8a86c90511d7a.mp3
- speaker: student
  text: まるごと書いてくれるの？　どうしよう……。
  audioPath: audio/lines/a899d3a0b6a1d6d5d68deb6347bd4b346186cacf0b890c7b96d19dd787c1e1cd.mp3
- speaker: narrator
  text: 発表の日。ユイが「ホタルは電気で光ります」と発表すると、先生が首をかしげました。
  audioPath: audio/lines/a6029f1e81e9d0d22ca82238ff466064786c27a22d5692b6e9e07de715ced89f.mp3
- speaker: teacher
  text: ホタルの光は、電気ではなく、体の中の化学反応なんだよ。どこで調べたのかな？
  audioPath: audio/lines/af8ffc2f008b3a6421df9053fc0f800f9923b58ab528ec5891acdbe85a6fe748.mp3
- speaker: student
  text: AI の答えを、そのまま書いちゃった……。確かめればよかったな。
  audioPath: audio/lines/4a057da8247c1cd3b6430e4283d813829788ec98188563425aa6600e79193b48.mp3
- speaker: narrator
  text: ユイは図書館で、昆虫の図鑑を開きました。
  audioPath: audio/lines/48002bb8498ad6e1f97ffa9104e6fe945a0952ed2f6f950f31bbd28d0746b1de.mp3
- speaker: student
  text: あれ？　電気じゃなくて、ルシフェリンという物質の化学反応で光るんだって！
  audioPath: audio/lines/fb1e06445b94e51e8563e9b287dfaabfb5549b50f6733e24dbcc84eededbe36f.mp3
- speaker: teacher
  text: よく確かめたね。調べた本の名前も書いてあって、すばらしいレポートだよ。
  audioPath: audio/lines/68a497493d5fe0edc942caf8cf0d70b83027d3c74558fa68b54011ebb9011835.mp3
- speaker: student
  text: AI、それって本当？
  audioPath: audio/lines/2bf2e6b6876229ee5bf3f17173312a5e9dd2e6d4d49c939b18f0fe1dbab0b854.mp3
- speaker: ai
  text: はい、本当です！　ホタルは電気で光っています。
  audioPath: audio/lines/43c2c91f54fe42c38529dd98cb8a457a99612b5aeb6e660b97a7e8903a41143f.mp3
- speaker: narrator
  text: でも、AI に聞き直しても、確かめたことにはなりません。ユイは、まちがったまま書いてしまいました。
  audioPath: audio/lines/4c946b5edff7d3371f7a1469f92266dbcc4be8f6f1d83be836bf7a9d5e2480b4.mp3
- speaker: narrator
  text: できた画像は、あっという間にほかのクラスにまで広まってしまいました。
  audioPath: audio/lines/27e2087799c110456fa1b178d02174250d2a18dba722ec8851138b284c7b663a.mp3
- speaker: friend
  text: こんなに広まるなんて……。消しても、もう全部は消せないよ。
  audioPath: audio/lines/e9f23dd698a79ec6725093b4bd09776add0d0b04c80681fac7abb0d8eb4ac19f.mp3
- speaker: narrator
  text: 写真を使われた友だちは、とても悲しい気持ちになりました。
  audioPath: audio/lines/0a1c3bef48391793846a281bfefb7f2e7b15dc56ad35089915f65b72e0002fa9.mp3
- speaker: student
  text: 友だちの写真や住所は、その人の大切な個人情報だよ。勝手に AI に入れるのはやめよう。
  audioPath: audio/lines/df10d629668a0e41312a18316875d641f4ee038e5c44c0d420b482d5d6528800.mp3
- speaker: teacher
  text: よく止めてくれたね。入れる前に「本人はいいと言っているかな？」と考えるのが大事だよ。
  audioPath: audio/lines/128214d9e4c1b9bdf4831f539904410a5a43b7c2d5cb7e5534ac5111e4d6fcb0.mp3
- speaker: friend
  text: そっか……。じゃあ、自分で描いたイラストでつくってみるよ！
  audioPath: audio/lines/e6f84aacc6857698c291fd1c895dad9e4b792a1da5eec6c6849a06e8001403f6.mp3
- speaker: narrator
  text: 次の日、ソウタがつくった画像のことで、クラスは大さわぎになっていました。
  audioPath: audio/lines/66341fe0e11648c83f3cc43f555f6587ebb5610c956943b6061ad7392a389327.mp3
- speaker: student
  text: あのとき、ひとこと言えばよかったな……。
  audioPath: audio/lines/54c19fc77628dd0abe3fe9f74cde41c33309d607648497564b262de4ac54471c.mp3
- speaker: narrator
  text: 作文はすぐにできあがりました。でも、読み返しても、自分の作文という気がしません。
  audioPath: audio/lines/b47590d91045b40c5e9ce6d6f8e34529e6bb526e8cbaaca97b455762b54018fd.mp3
- speaker: teacher
  text: 上手な文だけど、ユイさんらしさが見えないな。あなたが本当に感じたことを聞かせてほしいな。
  audioPath: audio/lines/a56c2985f9f3ee4a95d55a7839a7d5143a5754174bf139c43a98bcd6fc70b434.mp3
- speaker: student
  text: 夏祭りの思い出……そういえば、おばあちゃんといっしょに金魚すくいをしたっけ。
  audioPath: audio/lines/17dd08efe8d7d0f856933a7c26f8aa76d972fb84f0553741d4b21c7cb3888376.mp3
- speaker: narrator
  text: ユイは、そのときの気持ちを思い出しながら、自分のことばで書きました。
  audioPath: audio/lines/bfdf598d21804cbbc4ca6a46ebfb5063ebdbf1012043a04efd2281d740c6e481.mp3
- speaker: teacher
  text: 金魚すくいの場面、ユイさんのうれしい気持ちが伝わってくるね！
  audioPath: audio/lines/9b68532fadc002125ebec53ca143b5affe38fd7be8d8ea7226606da3c44ee084.mp3
- speaker: friend
  text: え、ぼくの作文を写すの？　それはちょっと……。
  audioPath: audio/lines/3360a279fe80c32de6f0900ef491d788c823d3e48f05654cc937590e9655502b.mp3
- speaker: narrator
  text: 人の作文を写すのも、AI に書かせてそのまま出すのも、自分の力にはなりません。
  audioPath: audio/lines/9170799aa997caa3797f602e540e5ce0bdb33e2cf4cbbc5794c958df7c1ef777.mp3
