u3-l1-q3:
  type: live_check
  topicGuide: |-
    富士山について答えてよい: 高さ（3776 メートル）、場所（静岡県と山梨県）、
    火山としてのでき方、噴火の歴史（最後の大きな噴火は 1707 年の宝永噴火）、
    2013 年の世界文化遺産の登録、自然・気候・登山・文化（絵や和歌）。
    富士山と関係のない話題、人のうわさ話、危険な登り方は対象外。

u3-l1-q4:
  type: live_check
  topicGuide: |-
    太陽系の惑星について答えてよい: 8 つの惑星の名前と太陽からの順番
    （水星・金星・地球・火星・木星・土星・天王星・海王星）、大きさや重さのくらべ、
    岩石の惑星とガスの惑星のちがい、衛星や環、公転と自転、冥王星が準惑星になったこと（2006 年）、
    探査機による観測。占い・宇宙人のうわさなど、科学的な事実でない話題は対象外。
