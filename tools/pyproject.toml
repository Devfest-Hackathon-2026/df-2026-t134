[project]
name = "ailearn-tools"
version = "0.1.0"
description = "Content tools for ailearn: validate and seed content/, draft exercises with Gemini"
requires-python = ">=3.13,<3.14"
# The content contracts are imported from the API source (api/app/schemas, mounted read-only
# and put on PYTHONPATH by compose.yaml). Keep pydantic compatible with api/uv.lock.
dependencies = [
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3",
    "firebase-admin>=7.1",
    # Gemini and speech go through the API's wrappers (api/app/ai), imported like the contracts.
    "google-cloud-texttospeech>=2.38",
    "google-genai>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["content_tools"]
known-third-party = ["app"]
